  - id: gcs
    name: Google Cloud Storage
    status: experimental
    summary: GCS with S3-compatible HMAC keys or the native provider.
    secrets: [GOOGLE_CREDENTIALS]
    config: [project, location, bucket]
    impl: { tofu_module: backup_gcs }
    docs: https://registry.opentofu.org/providers/hashicorp/google
    notes: "Owns a private, uniform-access bucket; reports the S3-compatible XML endpoint."
  - id: hetzner_storage_box
    name: Hetzner Storage Box
    status: experimental
    summary: Not S3; rsync/SFTP backups on a schedule via a systemd timer.
    secrets: [STORAGE_BOX_PASSWORD]
    config: [host, username, path]
    impl: { ansible_role: backup_hetzner_storage_box }
    docs: https://www.hetzner.com/storage/storage-box/
  - id: azure_blob
    name: Azure Blob Storage
    status: experimental
    summary: Blob containers via the azurerm provider.
    secrets: [ARM_CLIENT_ID, ARM_CLIENT_SECRET]
    config: [storage_account, resource_group, container]
    impl: { tofu_module: backup_azure }
    docs: https://registry.opentofu.org/providers/hashicorp/azurerm
    notes: "The storage account is pre-created by the operator; the module owns the private container."
