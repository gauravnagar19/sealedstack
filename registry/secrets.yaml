slot: secrets
contract: "name -> value (read); name, value -> stored (write) (spec section 4)."
implementations:
  - id: bitwarden
    name: Bitwarden Secrets Manager
    status: experimental
    summary: Machine secrets in Secrets Manager; the Create/Edit path is the official provider.
    secrets: [BWS_ACCESS_TOKEN]
    config: [project_name]
    impl: { tofu_module: secrets_bitwarden }
    docs: https://bitwarden.com/help/secrets-manager/
  - id: sops
    name: SOPS + age
    status: experimental
    summary: Secrets committed to git, encrypted with age; the zero-account option (v1.0).
    secrets: [SOPS_AGE_KEY]
    config: [file]
    impl: { adapter: engine/sealedstack/sopssecrets.py }
    docs: https://github.com/getsops/sops
  - id: aws_ssm
    name: AWS SSM Parameter Store
    status: experimental
    summary: Free standard-tier SecureString parameters.
    secrets: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
    config: [region, prefix]
    impl: { tofu_module: secrets_aws_ssm }
    docs: https://registry.opentofu.org/providers/hashicorp/aws
  - id: gcp
    name: Google Secret Manager
    status: experimental
    summary: Pay-per-access secrets with IAM.
    secrets: [GOOGLE_CREDENTIALS]
    config: [project, prefix]
    impl: { tofu_module: secrets_gcp }
    docs: https://registry.opentofu.org/providers/hashicorp/google
  - id: azure_kv
    name: Azure Key Vault
    status: experimental
    summary: Key Vault secrets with RBAC.
    secrets: [ARM_CLIENT_ID, ARM_CLIENT_SECRET]
    config: [key_vault_id, prefix]
    impl: { tofu_module: secrets_azure_kv }
    docs: https://registry.opentofu.org/providers/hashicorp/azurerm
  - id: infisical
    name: Infisical
    status: experimental
    summary: Managed or self-hosted secrets platform.
    secrets: [INFISICAL_TOKEN]
    config: [project_id, environment]
    impl: { adapter: engine/sealedstack/secretscli.py }
    docs: https://infisical.com/
  - id: openbao
    name: OpenBao
    status: experimental
    summary: The open-source fork of Vault; self-hosted.
    secrets: [OPENBAO_TOKEN]
    config: [addr, mount, prefix]
    impl: { tofu_module: secrets_openbao }
    docs: https://openbao.org/
  - id: vault
    name: HashiCorp Vault
    status: experimental
    summary: Self-hosted secrets engine (heavy to operate).
    secrets: [VAULT_TOKEN]
    config: [addr, mount, prefix]
    impl: { tofu_module: secrets_vault }
    docs: https://www.vaultproject.io/
  - id: onepassword
    name: 1Password
    status: experimental
    summary: 1Password Service Accounts.
    secrets: [OP_SERVICE_ACCOUNT_TOKEN]
    config: [vault]
    impl: { adapter: engine/sealedstack/secretscli.py }
    docs: https://developer.1password.com/
  - id: doppler
    name: Doppler
    status: experimental
    summary: Read-only service token (dp.st.) scoped to one config, read over the REST API; no CLI needed.
    secrets: [DOPPLER_TOKEN]
    config: []
    impl: { adapter: engine/sealedstack/doppler.py }
    docs: https://docs.doppler.com/docs/service-tokens
  - id: pass
    name: pass (password-store)
    status: experimental
    summary: Git-backed GPG password store.
    secrets: [PASSWORD_STORE_GPG_KEY]
    config: [store_dir]
    impl: { adapter: engine/sealedstack/secretscli.py }
    docs: https://www.passwordstore.org/
