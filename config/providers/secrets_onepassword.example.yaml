# 1Password CLI adapter (registry secrets: onepassword).
#
# Copy to config/providers/secrets_onepassword.yaml. engine/sealedstack/secretscli.py is
# dispatched by SECRETS_PROVIDER=onepassword; the value below is passed through
# the environment as SECRETS_VAULT. The service account token
# (OP_SERVICE_ACCOUNT_TOKEN) is supplied by the selected secrets slot.

vault: sealedstack
