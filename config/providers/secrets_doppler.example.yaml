# Doppler CLI adapter (registry secrets: doppler).
#
# Copy to config/providers/secrets_doppler.yaml. engine/sealedstack/secretscli.py is
# dispatched by SECRETS_PROVIDER=doppler; the values below are passed through
# the environment as SECRETS_PROJECT / SECRETS_ENV. The secret itself
# (DOPPLER_TOKEN) is supplied by the selected secrets slot.
#
#   SECRETS_PROJECT   Doppler project name
#   SECRETS_ENV       Doppler config name (dev, stg, prd, ...)

project: <doppler-project>
config: prd
