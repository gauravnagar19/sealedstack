# Okta OIDC adapter (registry gate: okta).
#
# Okta is a managed IdP, so there is nothing to deploy on the host: this file
# describes how the edge gate is wired to it. Copy to
# config/providers/gate_okta.yaml, create an OIDC "Web Application" in Okta with
# the redirect URI below, then store the client secret as OKTA_CLIENT_SECRET via
# the selected secrets slot.
#
# Validate:  engine/sealedstack/gateoidc.py okta [--check]
#
#   OKTA_CLIENT_SECRET   supplied by the selected secrets slot

provider: okta
org_url: https://<your-org>.okta.com
issuer: https://<your-org>.okta.com/oauth2/default
client_id: <okta-client-id>
scopes: [openid, profile, email]
groups_claim: groups            # optional: map Okta groups to the gate
gate_hostname: app.example.com  # hostname the gate is published on
