# Zitadel OIDC adapter (registry user_auth: zitadel).
#
# Copy to config/providers/user_auth_zitadel.yaml. sealedstack.userauth reads
# these values, resolves the secret from Secrets Manager (project `prod`, key
# `<app>.ZITADEL_CLIENT_SECRET`) and injects into .build/env.json:
#
#   ZITADEL_ISSUER        <- issuer
#   ZITADEL_CLIENT_ID     <- client_id
#   ZITADEL_CLIENT_SECRET <- secret
#
# In Zitadel, create a project + Web/OIDC application and register the callback
# URLs sealedstack.userauth prints. Non-secret values may also live under
# `providers.user_auth_zitadel` in config/stack.yaml.

issuer: https://auth.example.com
client_id: <zitadel-oidc-client-id>
