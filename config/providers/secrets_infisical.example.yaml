# Infisical CLI adapter (registry secrets: infisical).
#
# Copy to config/providers/secrets_infisical.yaml. engine/sealedstack/secretscli.py is
# dispatched by SECRETS_PROVIDER=infisical; the values below are passed through
# the environment as SECRETS_PROJECT / SECRETS_ENV. The secret itself
# (INFISICAL_TOKEN) is supplied by the selected secrets slot.
#
#   SECRETS_PROJECT   Infisical project ID
#   SECRETS_ENV       environment slug (dev, staging, prod, ...)

project_id: <infisical-project-id>
environment: prod
