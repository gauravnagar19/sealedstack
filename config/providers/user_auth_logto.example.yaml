# Logto OIDC adapter (registry user_auth: logto).
#
# Copy to config/providers/user_auth_logto.yaml. sealedstack.userauth reads
# these values, resolves the secret from Secrets Manager (project `prod`, key
# `<app>.LOGTO_CLIENT_SECRET`) and injects into .build/env.json:
#
#   LOGTO_ISSUER        <- issuer
#   LOGTO_CLIENT_ID     <- client_id (the Logto application id)
#   LOGTO_CLIENT_SECRET <- secret
#
# Create a Traditional Web application in Logto and register the callback URLs
# sealedstack.userauth prints. Non-secret values may also live under
# `providers.user_auth_logto` in config/stack.yaml.

issuer: https://auth.example.com
client_id: <logto-application-id>
