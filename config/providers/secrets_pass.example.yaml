# pass (password-store) CLI adapter (registry secrets: pass).
#
# Copy to config/providers/secrets_pass.yaml. engine/sealedstack/secretscli.py is
# dispatched by SECRETS_PROVIDER=pass; the value below is passed through the
# environment as SECRETS_PROJECT and PASSWORD_STORE_DIR. The GPG key
# (PASSWORD_STORE_GPG_KEY) is supplied by the selected secrets slot.
#
#   SECRETS_PROJECT     store subdirectory for the written secrets (optional)
#   PASSWORD_STORE_DIR  password-store directory (default ~/.password-store)

store_dir: ~/.password-store
subdir: sealedstack
