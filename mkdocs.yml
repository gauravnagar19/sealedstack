site_name: sealedstack
site_description: A sealed origin for your apps — zero inbound ports, mesh admin, tunnel ingress, rebuildable.
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
nav:
  - Home: README.md
  - Getting started:
      - Getting started: getting-started.md
      - User experience: user-experience.md
      - Prerequisites: prerequisites.md
      - Known limitations: limitations.md
  - Configuration:
      - Providers: providers.md
      - Config repository: config-repo.md
      - Infra repo and the tool image: infra-repo.md
      - CI/CD: ci-cd.md
  - Operations:
      - Netcup firewall: netcup-firewall.md
  - Design:
      - Architecture: architecture.md
      - Design spec: spec.md
      - Decision log: decisions.md
  - Contributing: development.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
validation:
  links:
    not_found: info      # links to repo files outside docs/ are valid on GitHub; tests/pytest/test_docs.py checks them
    absolute_links: ignore
    unrecognized_links: ignore
    anchors: warn
