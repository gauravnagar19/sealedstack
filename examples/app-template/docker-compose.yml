# Example app compose file.
#
# sealedstack rules (checked by `just validate`):
#   - no `ports:` on any service; traffic arrives through Traefik on dokploy-network
#   - no database service here when it is declared under needs: in sealedstack.yaml
services:
  web:
    build: .
    image: ghcr.io/example/example:${APP_VERSION}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      EXAMPLE_SECRET: ${EXAMPLE_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
