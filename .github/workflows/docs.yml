name: docs

# Build the documentation site (mkdocs-material). Deploying to GitHub Pages is
# gated twice (D-053): the repository must be public AND the owner must have set
# the repository variable PUBLIC_RELEASE_CONFIRMED to 'true'. Until both hold,
# this workflow only builds. tests/pytest/test_public_guard.py enforces it.
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material==9.5.42"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # D-053: nothing is published until the owner confirms. Both conditions are
    # required: a public repository and the owner-set PUBLIC_RELEASE_CONFIRMED.
    if: ${{ !github.event.repository.private && vars.PUBLIC_RELEASE_CONFIRMED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
