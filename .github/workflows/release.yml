name: release

# Publish the signed tool image (D-031, F2). Users run a pinned version of
# `ghcr.io/<owner>/sealedstack` from their infra repo, so this workflow is the
# only thing that ships the CLI to them.
#
# On a manual dispatch (the only trigger — D-052/B2) it:
#   0. checks the dispatcher is in the repo variable `RELEASE_APPROVERS`,
#   1. builds the toolbox and captures its manifest digest,
#   2. builds the tool image FROM that toolbox digest (amd64 + arm64),
#   3. waits for approval in the `release` environment (where supported) and
#      pushes + signs it (cosign keyless) and attaches a signed SBOM (syft).
#
# `workflow_dispatch` with `dry_run: true` does the whole thing **without
# pushing**: it builds one platform, generates the SBOM and signs a blob, so the
# supply chain can be exercised in CI safely.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (default: contents of VERSION)"
        required: false
      dry_run:
        description: "Build and sign without pushing (no public registry write)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          ACTOR: ${{ github.actor }}
          APPROVERS: ${{ vars.RELEASE_APPROVERS }}
        run: |
          set -euo pipefail
          if [[ ",${APPROVERS}," == *",${ACTOR},"* ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "not authorized: '${ACTOR}' is not in RELEASE_APPROVERS" >&2
          fi

  toolbox:
    needs: authorize
    if: ${{ needs.authorize.outputs.ok == 'true' && !inputs.dry_run }}
    uses: ./.github/workflows/toolbox.yml
    permissions:
      contents: read
      packages: write

  release:
    needs: [authorize, toolbox]
    if: ${{ always() && needs.authorize.outputs.ok == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    # The owner approves every push to the public registry (where GitHub supports
    # environment reviewers; on Free private repos the D-052 check is the gate).
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME}"
          else
            v="$(cat VERSION)"
          fi
          v="${v#v}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${v}"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the tool image
        id: tool
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TOOLBOX_OWNER=${{ github.repository_owner }}
            TOOLBOX_IMAGE=ghcr.io/${{ github.repository_owner }}/sealedstack-toolbox@${{ needs.toolbox.outputs.digest }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/sealedstack:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/sealedstack:latest

      - uses: sigstore/cosign-installer@v3

      - name: Sign the tool image (keyless)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/sealedstack@${{ steps.tool.outputs.digest }}

      - name: Generate an SBOM with syft
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/sealedstack@${{ steps.tool.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sealedstack-sbom.spdx.json

      - name: Attach and sign the SBOM
        run: |
          cosign attest --yes --type spdxjson \
            --predicate sbom.spdx.json \
            ghcr.io/${{ github.repository_owner }}/sealedstack@${{ steps.tool.outputs.digest }}

      - name: Summary
        run: |
          {
            echo "### sealedstack ${{ steps.version.outputs.version }} released"
            echo
            echo "- image: \`ghcr.io/${{ github.repository_owner }}/sealedstack:${{ steps.version.outputs.version }}\`"
            echo "- digest: \`${{ steps.tool.outputs.digest }}\`"
            echo "- base toolbox: \`ghcr.io/${{ github.repository_owner }}/sealedstack-toolbox@${{ needs.toolbox.outputs.digest }}\`"
            echo "- signed: cosign keyless, SBOM attached and signed"
          } >> "$GITHUB_STEP_SUMMARY"

  dry-run:
    # Exercise build + SBOM + signing without a registry write (M8).
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the toolbox (local, amd64)
        run: docker build -f toolbox/Dockerfile -t sealedstack-toolbox:dry-run .

      - name: Build the tool image (local, amd64)
        run: |
          docker build -f Dockerfile \
            --build-arg TOOLBOX_IMAGE=sealedstack-toolbox:dry-run \
            -t sealedstack:dry-run .

      - name: Export the image and sign the blob (keyless, no push)
        run: |
          docker save sealedstack:dry-run -o sealedstack-dry-run.tar
          cosign sign-blob --yes sealedstack-dry-run.tar \
            --output-signature sealedstack-dry-run.tar.sig \
            --output-certificate sealedstack-dry-run.tar.pem

      - name: Generate the SBOM with syft
        uses: anchore/sbom-action@v0
        with:
          image: sealedstack:dry-run
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sealedstack-sbom-dry-run.spdx.json

      - name: Summary
        run: echo "dry-run built and signed (no registry push)" >> "$GITHUB_STEP_SUMMARY"
