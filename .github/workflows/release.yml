name: release

# Publish the signed tool image (D-031, F2). Users run a pinned version of
# `ghcr.io/<owner>/sealedstack` from their infra repo, so this workflow is the
# only thing that ships the CLI to them.
#
# D-053: nothing here may make anything public. Images are pushed only to the
# repository owner's own GHCR namespace (ghcr.io/${{ github.repository_owner }}/...),
# which inherits the repository's visibility (private today), and no step ever
# sets package or repository visibility. Making an image public is an owner
# action in the GitHub UI after the owner has confirmed (see docs/maintainers/decisions.md D-053).
# tests/pytest/test_public_guard.py fails if a workflow, script or engine module
# adds a visibility change, GitHub Pages deploy, Homebrew tap or public-registry
# publish without BOTH `!github.event.repository.private` and
# `vars.PUBLIC_RELEASE_CONFIRMED == 'true'`.
#
# On a manual dispatch (the only trigger — D-052/B2) it:
#   0. checks the dispatcher is in the repo variable `RELEASE_APPROVERS`, and that the
#      `ci` workflow succeeded for the dispatched commit (D-081; it waits for a run
#      that is still going, because scripts/release.sh dispatches right after its push),
#   1. builds the toolbox and captures its manifest digest,
#   2. builds the tool image FROM that toolbox digest (amd64 + arm64),
#   3. waits for approval in the `release` environment (where supported) and
#      pushes + signs it (cosign keyless) and attaches a signed SBOM (syft).
#
# `workflow_dispatch` with `dry_run: true` does the whole thing **without
# pushing**: it builds one platform, generates the SBOM and signs a blob, so the
# supply chain can be exercised in CI safely.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (default: contents of VERSION)"
        required: false
      dry_run:
        description: "Build and sign without pushing (no registry write)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          ACTOR: ${{ github.actor }}
          APPROVERS: ${{ vars.RELEASE_APPROVERS }}
        run: |
          set -euo pipefail
          if [[ ",${APPROVERS}," == *",${ACTOR},"* ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "not authorized: '${ACTOR}' is not in RELEASE_APPROVERS" >&2
          fi

  ci-gate:
    # D-081: a release must not ship a commit whose `ci` run is red, unfinished or
    # missing (0.6.15 went out with a failed ci run). Fails closed: any API error,
    # no run, or a run that did not succeed stops the release before anything is built.
    needs: authorize
    if: ${{ needs.authorize.outputs.ok == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a successful ci run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          started=${SECONDS}
          while true; do
            # The newest ci run for exactly this commit decides (a re-run replaces the failed one).
            row="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=30" \
              --jq '.workflow_runs | sort_by(.created_at) | last | select(. != null) | [.status, (.conclusion // "none"), .html_url] | @tsv')"
            if [ -z "${row}" ]; then
              if [ $((SECONDS - started)) -ge 300 ]; then
                echo "::error::no ci run found for ${SHA}; push it to main (or re-run ci) and dispatch the release again"
                exit 1
              fi
              echo "no ci run for ${SHA} yet; waiting"
            else
              IFS=$'\t' read -r status conclusion url <<<"${row}"
              if [ "${status}" = "completed" ]; then
                if [ "${conclusion}" = "success" ]; then
                  echo "ci succeeded for ${SHA}: ${url}"
                  exit 0
                fi
                echo "::error::ci finished '${conclusion}' for ${SHA}, so it is not released: ${url}"
                exit 1
              fi
              echo "ci is ${status} for ${SHA}: ${url}"
            fi
            sleep 20
          done

  toolbox:
    needs: [authorize, ci-gate]
    if: ${{ needs.authorize.outputs.ok == 'true' && !inputs.dry_run }}
    uses: ./.github/workflows/toolbox.yml
    permissions:
      contents: read
      packages: write

  release:
    needs: [authorize, ci-gate, toolbox]
    # No bare always(): it would let this job run after a failed ci-gate or toolbox.
    if: ${{ !inputs.dry_run && needs.authorize.outputs.ok == 'true' && needs.ci-gate.result == 'success' && needs.toolbox.result == 'success' }}
    runs-on: ubuntu-latest
    # The owner approves every push to GHCR (where GitHub supports environment
    # reviewers; on Free private repos the D-052 check is the gate).
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            v="${INPUT_VERSION}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME}"
          else
            v="$(cat VERSION)"
          fi
          v="${v#v}"
          # The version is used in later scripts and image tags: only a plain version is allowed.
          case "${v}" in
            '' | *[!0-9A-Za-z.+-]*)
              echo "::error::'${v}' is not a plain version (letters, digits, dots, plus and minus only)"
              exit 1
              ;;
          esac
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${v}"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the tool image
        id: tool
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            TOOLBOX_IMAGE=ghcr.io/${{ github.repository_owner }}/sealedstack-toolbox@${{ needs.toolbox.outputs.digest }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/sealedstack:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/sealedstack:latest

      - uses: sigstore/cosign-installer@v3

      - name: Sign the tool image (keyless)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/sealedstack@${{ steps.tool.outputs.digest }}

      - name: Generate an SBOM with syft
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/sealedstack@${{ steps.tool.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sealedstack-sbom.spdx.json

      - name: Attach and sign the SBOM
        run: |
          cosign attest --yes --type spdxjson \
            --predicate sbom.spdx.json \
            ghcr.io/${{ github.repository_owner }}/sealedstack@${{ steps.tool.outputs.digest }}

      - name: Summary
        run: |
          {
            echo "### sealedstack ${{ steps.version.outputs.version }} released"
            echo
            echo "- image: \`ghcr.io/${{ github.repository_owner }}/sealedstack:${{ steps.version.outputs.version }}\`"
            echo "- digest: \`${{ steps.tool.outputs.digest }}\`"
            echo "- base toolbox: \`ghcr.io/${{ github.repository_owner }}/sealedstack-toolbox@${{ needs.toolbox.outputs.digest }}\`"
            echo "- signed: cosign keyless, SBOM attached and signed"
          } >> "$GITHUB_STEP_SUMMARY"

  dry-run:
    # Exercise build + SBOM + signing without a registry write (M8).
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the toolbox (local, amd64)
        run: docker build -f toolbox/Dockerfile -t sealedstack-toolbox:dry-run .

      - name: Build the tool image (local, amd64)
        run: |
          docker build -f Dockerfile \
            --build-arg TOOLBOX_IMAGE=sealedstack-toolbox:dry-run \
            -t sealedstack:dry-run .

      - name: Export the image and sign the blob (keyless, no push)
        run: |
          docker save sealedstack:dry-run -o sealedstack-dry-run.tar
          cosign sign-blob --yes sealedstack-dry-run.tar \
            --output-signature sealedstack-dry-run.tar.sig \
            --output-certificate sealedstack-dry-run.tar.pem

      - name: Generate the SBOM with syft
        uses: anchore/sbom-action@v0
        with:
          image: sealedstack:dry-run
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sealedstack-sbom-dry-run.spdx.json

      - name: Summary
        run: echo "dry-run built and signed (no registry push)" >> "$GITHUB_STEP_SUMMARY"
