name: sealedstack

# Reusable workflow (spec §5, M7). The infra repo calls this pinned at a ref:
#   uses: <owner>/sealedstack/.github/workflows/infra.yml@v<version>
#
# The command comes from the event when none is given (UX §8, §12.1):
#   pull_request      -> plan (check on the Setup PR), reported as a PR comment
#   push to main      -> apply (waits for `/sealedstack approve` when not approved)
#   schedule          -> status; then drift detection only when the repository
#                        variable SEALEDSTACK_DRIFT_ENABLED is 'true' (D-059)
#   issue_comment     -> the `/sealedstack <cmd>` in the comment
#   workflow_dispatch -> the chosen command
#
# Three jobs: `resolve` decides what (if anything) to run and who may run it;
# `approve` is the optional `production` environment gate for writes; `run`
# joins the tailnet and runs the pinned engine image. Write commands also pass the
# engine's own approval gate (D-052), which works on private GitHub Free repos.
on:
  workflow_call:
    inputs:
      command:
        required: false
        type: string
        default: ""
      args:
        required: false
        type: string
        default: ""
    secrets:
      BWS_ACCESS_TOKEN:
        required: false
      GH_TOKEN:
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed || 'false' }}
      command: ${{ steps.resolve.outputs.command }}
      args: ${{ steps.resolve.outputs.args }}
      write: ${{ steps.resolve.outputs.write || 'false' }}
      mesh: ${{ steps.resolve.outputs.mesh || 'false' }}
      pr: ${{ steps.resolve.outputs.pr }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      follow: ${{ steps.resolve.outputs.follow }}
    steps:
      - id: pre
        # Cheap pre-check, no image pull: ignore comments that are not commands
        # (this includes the bot's own comments).
        env:
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "issue_comment" ] && ! printf '%s\n' "$BODY" | grep -qE '^[[:space:]]*/sealedstack([[:space:]]|$)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Not a /sealedstack command; nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.pre.outputs.skip != 'true'

      - name: Log in to GHCR (the engine image is private, D-053)
        if: steps.pre.outputs.skip != 'true'
        # The calling workflow must grant `packages: read` (D-056) and the package
        # must allow this repository (Manage Actions access).
        continue-on-error: true
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Decide what to run
        id: resolve
        if: steps.pre.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          SEALEDSTACK_COMMAND: ${{ inputs.command }}
          SEALEDSTACK_ARGS: ${{ inputs.args }}
          SEALEDSTACK_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # D-059: the scheduled run adds drift detection only when this is 'true'.
          SEALEDSTACK_DRIFT_ENABLED: ${{ vars.SEALEDSTACK_DRIFT_ENABLED }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ ! -f sealedstack.version ]; then
            echo "::notice::No sealedstack.version yet; add it (and the workflow) before running commands."
            exit 0
          fi
          docker run --rm --network host \
            -v "$PWD:/infra" -w /infra \
            -v "$GITHUB_EVENT_PATH:/event.json:ro" -v "$GITHUB_OUTPUT:/ghout" \
            -e SEALEDSTACK_CONFIG=/infra/config -e GITHUB_EVENT_PATH=/event.json \
            -e GH_TOKEN -e SEALEDSTACK_COMMAND -e SEALEDSTACK_ARGS -e SEALEDSTACK_DEFAULT_BRANCH -e SEALEDSTACK_DRIFT_ENABLED \
            -e GITHUB_ACTOR -e GITHUB_REPOSITORY -e GITHUB_EVENT_NAME -e GITHUB_REF -e GITHUB_SHA \
            "ghcr.io/${{ github.repository_owner }}/sealedstack:$(cat sealedstack.version)" \
            ci resolve --output /ghout

  approve:
    # Only writes wait for the `production` environment (a second gate where the
    # plan supports required reviewers). Read-only commands skip straight to `run`.
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true' && needs.resolve.outputs.write == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Approved ${{ needs.resolve.outputs.command }}"

  run:
    needs: [resolve, approve]
    if: >-
      always() &&
      needs.resolve.outputs.proceed == 'true' &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: ubuntu-latest
    # One writer at a time; reads are never queued behind a write.
    concurrency:
      group: sealedstack-${{ github.repository }}-${{ needs.resolve.outputs.write == 'true' && 'write' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}

      - name: Log in to GHCR (the engine image is private, D-053)
        continue-on-error: true
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Version-pin parity (sealedstack.version == workflow ref)
        run: |
          set -euo pipefail
          v="$(cat sealedstack.version)"
          ref="$(grep -oE 'sealedstack/.github/workflows/infra.yml@v?[^ ]+' .github/workflows/sealedstack.yml | sed 's/.*@v\?//')"
          if [ "$v" != "$ref" ]; then
            echo "sealedstack.version ($v) != workflow ref ($ref); bump both in one PR" >&2
            exit 1
          fi

      # D-041/G14: the runner joins the tailnet as tag:ci before any step that
      # reaches a server or the Dokploy API (SSH 22, panel 3000). Servers are
      # addressed by their MagicDNS name (<server>.<mesh.tailnet>), so the engine
      # container runs with host networking to resolve it.
      - name: Tailscale trust (OIDC workload identity, else the OAuth client)
        id: ts
        if: needs.resolve.outputs.mesh == 'true'
        env:
          VAR_CLIENT_ID: ${{ vars.SEALEDSTACK_TS_OAUTH_CLIENT_ID }}
          VAR_AUDIENCE: ${{ vars.SEALEDSTACK_TS_AUDIENCE }}
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # OIDC settings are not secret: repository variables, else config/stack.yaml.
          cfg="$(python3 - <<'PY'
          import yaml
          try:
              stack = yaml.safe_load(open("config/stack.yaml", encoding="utf-8")) or {}
          except OSError:
              stack = {}
          mesh = (stack.get("providers") or {}).get("mesh_tailscale") or {}
          print(mesh.get("oauth_client_id") or "", mesh.get("audience") or "")
          PY
          )"
          cfg_id="${cfg%% *}"; cfg_aud="${cfg#* }"
          client_id="${VAR_CLIENT_ID:-$cfg_id}"
          audience="${VAR_AUDIENCE:-$cfg_aud}"
          if [ -n "$client_id" ] && [ -n "$audience" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "client_id=$client_id" >> "$GITHUB_OUTPUT"
            echo "audience=$audience" >> "$GITHUB_OUTPUT"
            echo "Tailscale: joining with workload identity federation (OIDC)."
          elif [ -n "$BWS_ACCESS_TOKEN" ]; then
            echo "mode=secret" >> "$GITHUB_OUTPUT"
            echo "::notice::Tailscale OIDC trust is not configured (providers.mesh_tailscale.oauth_client_id/audience); falling back to the OAuth client secret from the secret source."
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::warning::Tailscale trust is not configured and no secret source token is set; this job cannot reach servers or Dokploy."
          fi

      - name: Read the Tailscale OAuth client (fallback)
        id: ts_secret
        if: steps.ts.outputs.mode == 'secret'
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Masked in the log, written to this step's outputs only.
          for pair in "tailscale_oauth_client_id client_id" "tailscale_oauth_client_secret client_secret"; do
            set -- $pair
            docker run --rm -v "$PWD:/infra" -w /infra -v "$GITHUB_OUTPUT:/ghout" \
              -e SEALEDSTACK_CONFIG=/infra/config -e BWS_ACCESS_TOKEN \
              "ghcr.io/${{ github.repository_owner }}/sealedstack:$(cat sealedstack.version)" \
              debug ci-export "$1" --name "$2" --output /ghout
          done

      - name: Join the tailnet as tag:ci (OIDC)
        if: steps.ts.outputs.mode == 'oidc'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ steps.ts.outputs.client_id }}
          audience: ${{ steps.ts.outputs.audience }}
          tags: tag:ci

      - name: Join the tailnet as tag:ci (OAuth client fallback)
        if: steps.ts.outputs.mode == 'secret'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ steps.ts_secret.outputs.client_id }}
          oauth-secret: ${{ steps.ts_secret.outputs.client_secret }}
          tags: tag:ci

      - name: sealedstack ${{ needs.resolve.outputs.command }}
        # `ci exec` runs the resolved command behind the D-052 approval gate for
        # writes and reports the result (plan comment, checklist, Status issue).
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          SEALEDSTACK_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SEALEDSTACK_PR: ${{ needs.resolve.outputs.pr }}
          SEALEDSTACK_RESOLVED_COMMAND: ${{ needs.resolve.outputs.command }}
          SEALEDSTACK_RESOLVED_ARGS: ${{ needs.resolve.outputs.args }}
          SEALEDSTACK_RESOLVED_PR: ${{ needs.resolve.outputs.pr }}
          SEALEDSTACK_RESOLVED_FOLLOW: ${{ needs.resolve.outputs.follow }}
        run: |
          set -euo pipefail
          docker run --rm -i --network host \
            -v "$PWD:/infra" -w /infra \
            -v "$GITHUB_EVENT_PATH:/event.json:ro" \
            -e SEALEDSTACK_CONFIG=/infra/config \
            -e SEALEDSTACK_WORKDIR=/infra/.sealedstack \
            -e GITHUB_EVENT_PATH=/event.json \
            -e BWS_ACCESS_TOKEN -e GH_TOKEN -e GITHUB_ACTOR -e GITHUB_REPOSITORY -e GITHUB_ACTIONS \
            -e GITHUB_EVENT_NAME -e GITHUB_REF -e GITHUB_SHA \
            -e GITHUB_SERVER_URL -e GITHUB_RUN_ID \
            -e SEALEDSTACK_DEFAULT_BRANCH -e SEALEDSTACK_PR \
            -e SEALEDSTACK_RESOLVED_COMMAND -e SEALEDSTACK_RESOLVED_ARGS -e SEALEDSTACK_RESOLVED_PR \
            -e SEALEDSTACK_RESOLVED_FOLLOW \
            "ghcr.io/${{ github.repository_owner }}/sealedstack:$(cat sealedstack.version)" \
            ci exec

      - name: Job summary
        if: always()
        run: echo "sealedstack ${{ needs.resolve.outputs.command }} finished (${{ job.status }})" >> "$GITHUB_STEP_SUMMARY"
