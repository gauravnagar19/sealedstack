# Reusable app release workflow, shipped by sealedstack (spec 4.3, D-030).
#
# An app repo calls this pinned to a sealedstack version:
#
#   jobs:
#     sealedstack:
#       uses: <owner>/sealedstack/.github/workflows/app.yml@v0.5.0
#       with:
#         event: ${{ github.event_name }}
#         tag: ${{ inputs.tag }}
#       secrets: inherit
#       permissions: { contents: write, packages: write, id-token: write, actions: write, deployments: write }
#
# On push: mint the next v0.0.X tag and build/push each `build:` service to
#          $SEALEDSTACK_REGISTRY, then prune old images.
# On workflow_dispatch: deploy an existing tag (no rebuild), joining the tailnet
#          as tag:release (Dokploy API on TCP 3000 only, never SSH; D-057) and
#          updating only release-owned Dokploy fields (D-032), then recording the
#          released version as a GitHub Deployment of environment `production` in
#          this repo with the built-in GITHUB_TOKEN (D-060).
name: app-release

on:
  workflow_call:
    inputs:
      event:
        description: The caller's github.event_name (push or workflow_dispatch).
        required: true
        type: string
      tag:
        description: The version to release (workflow_dispatch), e.g. v0.0.12.
        required: false
        type: string
        default: ""
      promote_on_push:
        description: Deploy automatically after a push build (default false).
        required: false
        type: boolean
        default: false
      skip_unchanged_builds:
        description: >-
          Reuse the previous version's image for a service whose inputs did not change (D-093).
          off (default): build every service. dry-run: build everything and only report what
          would be reused. on: retag the previous image instead of building.
        required: false
        type: string
        default: "off"
      build_inputs:
        description: >-
          JSON object mapping each compose service name to the globs of every file its image
          is built from (D-093). A service missing from it is always built.
        required: false
        type: string
        default: "{}"
      build_ignore:
        description: JSON list of globs that never affect any image (docs, tests, workflows).
        required: false
        type: string
        default: "[]"
      build_version_only:
        description: >-
          JSON list of JSON files whose change only counts when something other than a
          "version" key changed (a version bump alone is not a change).
        required: false
        type: string
        default: "[]"

permissions:
  contents: write
  packages: write
  id-token: write
  actions: write
  deployments: write

# F5: serialise releases per repository so two close pushes cannot mint the same
# v0.0.N. Do not cancel an in-flight release.
concurrency:
  group: sealedstack-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Resolve the version and the matrix of services that have `build:`.
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.services.outputs.matrix }}
      count: ${{ steps.services.outputs.count }}
      mode: ${{ steps.services.outputs.mode }}
      release_approvers: ${{ steps.approvers.outputs.list }}
      package: ${{ steps.repo.outputs.package }}
      registry: ${{ steps.registry.outputs.prefix }}
      registry_host: ${{ steps.registry.outputs.host }}
      short_sha: ${{ steps.sha.outputs.short }}
      previous: ${{ steps.version.outputs.previous }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      build_count: ${{ steps.plan.outputs.build_count }}
      reuse_services: ${{ steps.plan.outputs.reuse_services }}
      reuse_count: ${{ steps.plan.outputs.reuse_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (pinned)
        # FR-5: the steps below parse YAML. Never rely on whatever the runner image
        # happens to ship: install the pinned version into this job's own Python.
        run: python3 -m pip install "pyyaml==6.0.2"

      - name: Resolve the version
        id: version
        env:
          EVENT: ${{ inputs.event }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            if [ -z "${INPUT_TAG}" ]; then
              echo "::error::workflow_dispatch requires a 'tag' input"
              exit 1
            fi
            echo "version=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            latest="$(git tag -l 'v0.0.*' | sed 's/^v//' | sort -t. -k3 -n | tail -n1)"
            last="${latest##*.}"
            case "${last}" in '' | *[!0-9]*) last=-1 ;; esac
            echo "version=v0.0.$(( last + 1 ))" >> "$GITHUB_OUTPUT"
            # The newest existing version: the image source for a service that is reused (D-093).
            if [ "${last}" != "-1" ]; then echo "previous=v0.0.${last}" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Short commit SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Repository slug
        id: repo
        run: echo "package=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"

      - name: Resolve the registry from config
        # `publish` (infra apply) writes SEALEDSTACK_REGISTRY (e.g. ghcr.io/<owner>)
        # from the registry slot (D-033). Until then, default to the owner's GHCR.
        id: registry
        env:
          SEALEDSTACK_REGISTRY: ${{ vars.SEALEDSTACK_REGISTRY }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Before the first infra apply the variable does not exist yet: default to
          # the repository owner's GHCR namespace (lower case, as GHCR requires), so
          # the very first build works and the first release has images to deploy.
          prefix="${SEALEDSTACK_REGISTRY:-ghcr.io/$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')}"
          if [ -z "${SEALEDSTACK_REGISTRY}" ]; then
            echo "SEALEDSTACK_REGISTRY is not set yet; using ${prefix} (the infra apply publishes it)."
          fi
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "host=${prefix%%/*}" >> "$GITHUB_OUTPUT"

      - name: Release approvers (read from the default branch)
        id: approvers
        # DR-11. The list comes from sealedstack.yaml on the DEFAULT branch, not from
        # the ref this run was started on: otherwise whoever starts the run could pick
        # a branch whose manifest names them. (A writer who can push to the default
        # branch can still edit the list; without branch protection, which private
        # repos on GitHub Free lack, this limits who may start a release, not what a
        # writer could change. See docs/limitations.md.)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="${DEFAULT_BRANCH:-main}"
          if git show "origin/${branch}:sealedstack.yaml" > "${RUNNER_TEMP}/default-manifest.yaml" 2>/dev/null; then
            python3 - "${RUNNER_TEMP}/default-manifest.yaml" <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          import yaml
          manifest = yaml.safe_load(open(sys.argv[1], encoding="utf-8")) or {}
          approvers = (manifest.get("release") or {}).get("approvers") or []
          names = [str(a) for a in approvers if str(a).replace("-", "").replace("[bot]", "").isalnum()]
          print("list=" + " ".join(names))
          PY
          else
            echo "list=" >> "$GITHUB_OUTPUT"
          fi

      - name: "Services with build:"
        id: services
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import yaml
          manifest = yaml.safe_load(open("sealedstack.yaml", encoding="utf-8")) or {}
          print("mode=" + ((manifest.get("build") or {}).get("mode") or "ci"))
          compose = yaml.safe_load(open(manifest.get("compose", "docker-compose.yml"), encoding="utf-8")) or {}
          include = []
          for name, spec in (compose.get("services") or {}).items():
              if not isinstance(spec, dict) or "build" not in spec:
                  continue
              build = spec["build"]
              if isinstance(build, dict):
                  context = build.get("context", ".")
                  dockerfile = build.get("dockerfile", "")
                  target = build.get("target", "")
              else:
                  context, dockerfile, target = (build or "."), "", ""
              include.append({"service": name, "context": context, "dockerfile": dockerfile, "target": target})
          print("matrix=" + json.dumps({"include": include}))
          print("count=" + str(len(include)))
          PY

      - name: Log in to the registry (to look for the previous images)
        if: ${{ inputs.event == 'push' && inputs.skip_unchanged_builds != 'off' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan which images to build or reuse (D-093)
        id: plan
        env:
          EVENT: ${{ inputs.event }}
          MODE: ${{ inputs.skip_unchanged_builds }}
          BUILD_INPUTS: ${{ inputs.build_inputs }}
          BUILD_IGNORE: ${{ inputs.build_ignore }}
          BUILD_VERSION_ONLY: ${{ inputs.build_version_only }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          REGISTRY: ${{ steps.registry.outputs.prefix }}
          PACKAGE: ${{ steps.repo.outputs.package }}
          MATRIX: ${{ steps.services.outputs.matrix }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import fnmatch
          import json
          import os
          import re
          import subprocess
          import sys

          env = os.environ
          mode = env.get("MODE", "off")
          matrix = json.loads(env["MATRIX"])
          services = [entry["service"] for entry in matrix["include"]]


          def finish(reuse, why, changed=None):
              """Print the outputs (stdout is $GITHUB_OUTPUT) and a summary (stderr and the step summary)."""
              will_reuse = reuse if mode == "on" else []
              build = [entry for entry in matrix["include"] if entry["service"] not in will_reuse]
              print("build_matrix=" + json.dumps({"include": build}))
              print("build_count=" + str(len(build)))
              print("reuse_services=" + " ".join(will_reuse))
              print("reuse_count=" + str(len(will_reuse)))
              lines = [f"### Image build plan ({mode})", "", f"Reason: {why}", "", "| service | decision |", "| --- | --- |"]
              for name in services:
                  if name in will_reuse:
                      decision = f"reuse {env.get('PREVIOUS')}"
                  elif name in reuse:
                      decision = "would reuse (dry-run, building anyway)"
                  else:
                      decision = "build"
                  lines.append(f"| {name} | {decision} |")
              if changed is not None:
                  lines += ["", f"{len(changed)} file(s) changed since {env.get('PREVIOUS')}."]
              text = "\n".join(lines)
              print(text, file=sys.stderr)
              summary = env.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write(text + "\n")
              raise SystemExit(0)


          def build_all(why):
              finish([], why)


          if env.get("EVENT") != "push" or mode == "off":
              build_all("skipping is off" if mode == "off" else "not a push")
          if mode not in ("dry-run", "on"):
              print(f"::error::skip_unchanged_builds must be off, dry-run or on, not {mode!r}", file=sys.stderr)
              raise SystemExit(1)
          previous = env.get("PREVIOUS", "")
          if not previous:
              build_all("no previous version to reuse")
          try:
              inputs = json.loads(env.get("BUILD_INPUTS") or "{}")
              ignore = json.loads(env.get("BUILD_IGNORE") or "[]")
              version_only = json.loads(env.get("BUILD_VERSION_ONLY") or "[]")
          except ValueError as error:
              print(f"::error::build_inputs, build_ignore and build_version_only must be JSON: {error}", file=sys.stderr)
              raise SystemExit(1)
          message = subprocess.run(["git", "log", "-1", "--format=%B"], capture_output=True, text=True).stdout
          if "[build-all]" in message:
              build_all("the head commit message contains [build-all]")
          diff = subprocess.run(["git", "diff", "--name-only", previous, "HEAD"], capture_output=True, text=True)
          if diff.returncode != 0:
              build_all(f"cannot diff against {previous}")
          changed = [line for line in diff.stdout.splitlines() if line]


          def regex(glob):
              out, i = "", 0
              while i < len(glob):
                  if glob.startswith("**/", i):
                      out += "(?:.*/)?"
                      i += 3
                  elif glob.startswith("**", i):
                      out += ".*"
                      i += 2
                  elif glob[i] == "*":
                      out += "[^/]*"
                      i += 1
                  elif glob[i] == "?":
                      out += "[^/]"
                      i += 1
                  else:
                      out += re.escape(glob[i])
                      i += 1
              return re.compile(out + r"\Z")


          def matches(path, globs):
              return any(regex(g).match(path) for g in globs)


          def strip_version(value):
              if isinstance(value, dict):
                  return {k: strip_version(v) for k, v in value.items() if k != "version"}
              if isinstance(value, list):
                  return [strip_version(v) for v in value]
              return value


          def only_version_changed(path):
              old = subprocess.run(["git", "show", f"{previous}:{path}"], capture_output=True, text=True)
              if old.returncode != 0 or not os.path.exists(path):
                  return False
              try:
                  return strip_version(json.loads(old.stdout)) == strip_version(json.load(open(path, encoding="utf-8")))
              except ValueError:
                  return False


          # A service whose inputs are not declared is always built. A changed file that no
          # service claims and that is not ignored could feed any image: build everything.
          rebuild = {name for name in services if name not in inputs}
          for path in changed:
              if matches(path, ignore) or (path in version_only and only_version_changed(path)):
                  continue
              claimed = [name for name in services if name in inputs and matches(path, inputs[name])]
              if not claimed:
                  build_all(f"{path} is not listed for any image, so every image could depend on it")
              rebuild.update(claimed)
          reuse = [name for name in services if name not in rebuild]

          # A previous image that is not in the registry (pruned, failed run) cannot be reused.
          for name in list(reuse):
              ref = f"{env['REGISTRY']}/{env['PACKAGE']}-{name}:{previous}"
              if subprocess.run(["docker", "buildx", "imagetools", "inspect", ref], capture_output=True).returncode != 0:
                  reuse.remove(name)
          finish(reuse, "changed files decide each image", changed)
          PY

  # Build and push every built service in parallel with the GitHub Actions cache.
  build:
    needs: setup
    if: >-
      ${{ inputs.event == 'push' && needs.setup.outputs.mode != 'server'
          && needs.setup.outputs.build_count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (pinned)
        # FR-5: the steps below parse YAML. Never rely on whatever the runner image
        # happens to ship: install the pinned version into this job's own Python.
        run: python3 -m pip install "pyyaml==6.0.2"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.setup.outputs.registry_host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platforms
        id: platforms
        run: |
          set -euo pipefail
          value="$(python3 -c 'import yaml; print(",".join((yaml.safe_load(open("sealedstack.yaml")) or {}).get("build", {}).get("platforms") or ["linux/amd64"]))')"
          echo "platforms=${value}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: |
            ${{ needs.setup.outputs.registry }}/${{ needs.setup.outputs.package }}-${{ matrix.service }}:${{ needs.setup.outputs.version }}
            ${{ needs.setup.outputs.registry }}/${{ needs.setup.outputs.package }}-${{ matrix.service }}:sha-${{ needs.setup.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # D-093: an image whose inputs did not change keeps its content; give it the new
  # version tag in the registry (no rebuild, no pull). One job for all such services.
  reuse:
    needs: setup
    if: >-
      ${{ inputs.event == 'push' && needs.setup.outputs.mode != 'server'
          && needs.setup.outputs.reuse_count != '0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.setup.outputs.registry_host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag the previous images
        env:
          SERVICES: ${{ needs.setup.outputs.reuse_services }}
          PREVIOUS: ${{ needs.setup.outputs.previous }}
          VERSION: ${{ needs.setup.outputs.version }}
          SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
          REGISTRY: ${{ needs.setup.outputs.registry }}
          PACKAGE: ${{ needs.setup.outputs.package }}
        run: |
          set -euo pipefail
          for service in ${SERVICES}; do
            image="${REGISTRY}/${PACKAGE}-${service}"
            docker buildx imagetools create -t "${image}:${VERSION}" -t "${image}:sha-${SHORT_SHA}" "${image}:${PREVIOUS}"
            echo "${image}: ${PREVIOUS} reused as ${VERSION}"
          done

  # Mint the git tag once every image is pushed. Runs even when there are no
  # built services (F8), so server-mode and no-build apps still get a version.
  tag:
    needs: [setup, build, reuse]
    if: ${{ always() && inputs.event == 'push' && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the version tag
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          git tag "${VERSION}"
          git push origin "${VERSION}"

  # Retention (spec 4.3): keep the last 30 version tags, delete everything else
  # tagged, and delete untagged images older than 7 days. Best-effort.
  prune:
    needs: [setup, tag]
    if: ${{ always() && inputs.event == 'push' && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE: ${{ needs.setup.outputs.package }}
      TTL_DAYS: "7"
      # Keep the currently-deployed version in addition to the last 30 (F8). It is
      # read from the latest successful `production` deployment (D-060); the old
      # repository variable is only a deprecated fallback and is no longer written.
      DEPLOYED_VERSION: ${{ vars.SEALEDSTACK_RELEASED_VERSION }}
      DOKPLOY_URL: ${{ vars.SEALEDSTACK_DOKPLOY_URL }}
      DOKPLOY_KEY: ${{ secrets.SEALEDSTACK_DOKPLOY_API_KEY }}
      COMPOSE_IDS: ${{ vars.SEALEDSTACK_COMPOSE_IDS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prune old image versions
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          # F8: packages can be user- or org-owned; pick the right API scope.
          if gh api "/orgs/${owner}" >/dev/null 2>&1; then
            scope="/orgs/${owner}"
          else
            scope="/users/${owner}"
          fi
          # The deployed version comes from the latest successful `production`
          # deployment (D-060), then the deprecated variable, then the APP_VERSION
          # in Dokploy when neither is available.
          deployed=""
          for deployment_id in $(gh api "/repos/${GITHUB_REPOSITORY}/deployments?environment=production&per_page=30" --jq '.[].id' 2>/dev/null || true); do
            outcome="$(gh api "/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=30" \
              --jq '[.[] | select(.state == "success" or .state == "failure" or .state == "error")] | (.[0].state // "")' 2>/dev/null || true)"
            if [ "${outcome}" = "success" ]; then
              deployed="$(gh api "/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}" --jq '.payload.version // .ref' 2>/dev/null || true)"
              break
            fi
          done
          deployed="${deployed:-${DEPLOYED_VERSION:-}}"
          if [ -z "${deployed}" ] && [ -n "${DOKPLOY_URL:-}" ] && [ -n "${COMPOSE_IDS:-}" ]; then
            deployed="$(python3 - <<'PY' || true
          import json
          import os
          import urllib.request

          url = (os.environ.get("DOKPLOY_URL") or "").rstrip("/")
          key = os.environ.get("DOKPLOY_KEY") or ""
          try:
              ids = json.loads(os.environ.get("COMPOSE_IDS") or "{}")
          except ValueError:
              ids = {}
          for compose_id in ids.values():
              request = urllib.request.Request(
                  f"{url}/api/compose.one?composeId={compose_id}",
                  headers={"x-api-key": key},
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      data = json.loads(response.read() or b"{}")
              except Exception:
                  continue
              for line in (data.get("env") or "").split("\n"):
                  if line.startswith("APP_VERSION="):
                      print(line.split("=", 1)[1].strip())
                      raise SystemExit(0)
          PY
          )"
          fi
          kept="$( { git tag -l 'v0.0.*' | sort -t. -k3 -n | tail -n30; if [ -n "${deployed}" ]; then echo "${deployed}"; fi; } )"
          cutoff="$(date -u -d "${TTL_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-"${TTL_DAYS}"d +%Y-%m-%dT%H:%M:%SZ)"
          packages="$(gh api "${scope}/packages?package_type=container" --paginate --jq '.[].name' | grep "^${PACKAGE}-" || true)"
          while IFS= read -r pkg; do
            [ -n "${pkg}" ] || continue
            while IFS=$'\t' read -r id created tags; do
              [ -n "${id}" ] || continue
              keep=0
              if [ -n "${tags}" ]; then
                IFS=',' read -r -a arr <<< "${tags}"
                for t in "${arr[@]}"; do
                  for k in ${kept}; do [ "${t}" = "${k}" ] && keep=1; done
                done
                [ "${keep}" -eq 1 ] || gh api --method DELETE "${scope}/packages/container/${pkg}/versions/${id}" || true
              elif [[ "${created}" < "${cutoff}" ]]; then
                gh api --method DELETE "${scope}/packages/container/${pkg}/versions/${id}" || true
              fi
            done < <(gh api "${scope}/packages/container/${pkg}/versions" --paginate \
              --jq '.[] | "\(.id)\t\(.created_at)\t\([.metadata.container.tags[]?] | join(","))"')
          done <<< "${packages}"

  # Release: deploy an existing tag. Refuse if the images are missing (no
  # rebuild), then update only the release-owned fields and wait for a NEW
  # deployment id to reach `done` (spec 4.3, N5).
  release:
    needs: [setup, build, reuse, tag]
    if: >-
      ${{ always() && (inputs.event == 'workflow_dispatch' ||
          (inputs.promote_on_push &&
            (needs.build.result == 'success' || needs.setup.outputs.mode == 'server' ||
              (needs.build.result == 'skipped' && needs.reuse.result == 'success')) &&
            needs.reuse.result != 'failure')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Only the listed approvers may release
        # DR-11: sealedstack.yaml `release.approvers` (optional). When it is set, the
        # person who started this run (github.actor) must be listed; anyone else with
        # write access to the repo is refused before anything touches Dokploy. Without
        # the list, anyone who can run the workflow can release (see docs/limitations.md).
        env:
          ACTOR: ${{ github.actor }}
          APPROVERS: ${{ needs.setup.outputs.release_approvers }}
        run: |
          set -euo pipefail
          if [ -z "${APPROVERS}" ]; then
            echo "No release.approvers in sealedstack.yaml: any user who can run this workflow may release."
            exit 0
          fi
          for approver in ${APPROVERS}; do
            if [ "$(printf '%s' "${approver}" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "${ACTOR}" | tr '[:upper:]' '[:lower:]')" ]; then
              echo "Release started by ${ACTOR}, a listed approver."
              exit 0
            fi
          done
          echo "::error::${ACTOR} is not in release.approvers of sealedstack.yaml (${APPROVERS}); only they may release this app."
          exit 1

      - uses: actions/checkout@v4
        with:
          # F6: on the push path the version tag may not exist yet (it is minted
          # in `tag`, in parallel); check out the commit that was built.
          ref: ${{ inputs.event == 'workflow_dispatch' && inputs.tag || github.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.setup.outputs.registry_host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (pinned)
        # FR-5: the steps below parse YAML. Never rely on whatever the runner image
        # happens to ship: install the pinned version into this job's own Python.
        run: python3 -m pip install "pyyaml==6.0.2"

      - name: Refuse a tag whose images do not exist
        if: needs.setup.outputs.mode != 'server'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          PACKAGE: ${{ needs.setup.outputs.package }}
          REGISTRY: ${{ needs.setup.outputs.registry }}
        run: |
          set -euo pipefail
          missing=0
          # F8: read the compose path from the manifest, not a hardcoded name.
          services="$(python3 -c 'import yaml; m=yaml.safe_load(open("sealedstack.yaml")) or {}; c=yaml.safe_load(open(m.get("compose","docker-compose.yml"))) or {}; print(" ".join(n for n,s in (c.get("services") or {}).items() if isinstance(s,dict) and "build" in s))')"
          for service in ${services}; do
            ref="${REGISTRY}/${PACKAGE}-${service}:${VERSION}"
            if ! docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then
              echo "::error::missing image ${ref}"
              missing=1
            fi
          done
          [ "${missing}" -eq 0 ] || exit 1

      - name: Require the Tailscale release trust settings
        env:
          CLIENT_ID: ${{ vars.SEALEDSTACK_TS_RELEASE_CLIENT_ID }}
          AUDIENCE: ${{ vars.SEALEDSTACK_TS_RELEASE_AUDIENCE }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$AUDIENCE" ]; then
            echo "::error::The Tailscale release identity (tag:release, D-057) is not configured for this repository. Create a separate OIDC trust credential for tag:release in the Tailscale console, set providers.mesh_tailscale.release_oauth_client_id and release_audience in the infra repo's config/stack.yaml (sealedstack publishes them as SEALEDSTACK_TS_RELEASE_CLIENT_ID / SEALEDSTACK_TS_RELEASE_AUDIENCE after an apply), or set those two repository variables by hand."
            exit 1
          fi

      - name: Join the tailnet as tag:release
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.SEALEDSTACK_TS_RELEASE_CLIENT_ID }}
          audience: ${{ vars.SEALEDSTACK_TS_RELEASE_AUDIENCE }}
          tags: tag:release

      - name: Render the deploy compose at the tag
        if: needs.setup.outputs.mode != 'server'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import yaml
          manifest = yaml.safe_load(open("sealedstack.yaml", encoding="utf-8")) or {}
          compose = yaml.safe_load(open(manifest.get("compose", "docker-compose.yml"), encoding="utf-8")) or {}
          for spec in (compose.get("services") or {}).values():
              if isinstance(spec, dict):
                  spec.pop("build", None)
          # The managed database is a Swarm service on dokploy-network. Dokploy joins only the service with the domain to it,
          # so every service that reads a platform variable (needs.*.env, e.g. DATABASE_URL) must join it too.
          names = {str(s["env"]) for s in (manifest.get("needs") or {}).values() if isinstance(s, dict) and s.get("env")}
          attached = False
          for spec in (compose.get("services") or {}).values():
              if not isinstance(spec, dict) or not any(n in str(spec.get("environment") or "") + str(spec.get("env_file") or "") for n in names):
                  continue
              nets = spec.get("networks")
              if nets is None:
                  spec["networks"] = ["default", "dokploy-network"]
              elif isinstance(nets, list):
                  if "dokploy-network" not in nets:
                      nets.append("dokploy-network")
              elif isinstance(nets, dict):
                  nets.setdefault("dokploy-network", None)
              attached = True
          if attached and isinstance(compose.setdefault("networks", {}), dict):
              compose["networks"].setdefault("dokploy-network", {"external": True})
          os.makedirs(".build", exist_ok=True)
          with open(".build/deploy-compose.yml", "w", encoding="utf-8") as handle:
              yaml.safe_dump(compose, handle, sort_keys=False)
          PY
          echo "rendered .build/deploy-compose.yml"

      - name: Lint the deploy compose for host-escape settings (D-063)
        # The same rules the infra repo applies in check/plan/apply
        # (engine/sealedstack/composelint.py; tests keep this copy identical).
        # A privileged container, the Docker socket or host paths, host
        # namespaces, extra capabilities or devices are refused before anything
        # reaches Dokploy.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Host-escape lint for app compose files (D-063, FR-1 defence in depth).

          An app's compose file runs on the server through Dokploy. Whoever can change it
          can ask Docker for root on the host: a privileged container, the Docker socket,
          a host path, the host's namespaces. This lint refuses those settings. It runs

          - in the app release job (``app.yml``), on the rendered deploy compose, and
          - in the infra repo's ``check`` / ``plan`` / ``apply``, on every app's compose.

          Pure standard library, so the same source is embedded verbatim in ``app.yml``
          (``tests/pytest/test_composelint.py`` keeps the two identical).
          """
          from __future__ import annotations

          import posixpath
          import sys

          # Host paths a container may bind-mount (read the time zone, nothing else).
          ALLOWED_HOST_PATHS = ("/etc/localtime",)
          # Capabilities an app may add. Everything else (SYS_ADMIN, NET_ADMIN, SYS_PTRACE, ALL, ...) is refused.
          ALLOWED_CAPS = ("CHOWN", "FOWNER", "KILL", "NET_BIND_SERVICE", "SETGID", "SETUID")
          # Namespace / confinement keys: ``host`` shares the host's view with the container.
          HOST_NAMESPACE_KEYS = ("pid", "ipc", "uts", "userns_mode", "cgroup")
          SOCKET_NAMES = ("docker.sock", "containerd.sock", "podman.sock", "crio.sock")


          def _truthy(value) -> bool:
              """True for anything that is not a literal false (an unresolved ${VAR} counts as true)."""
              if value is None or value is False:
                  return False
              return str(value).strip().lower() not in ("false", "no", "off", "0", "")


          def _sources(volume) -> "list[tuple[str, str, bool]]":
              """``(source, target, is_bind)`` for one service volume entry (short or long syntax)."""
              if isinstance(volume, dict):
                  kind = str(volume.get("type") or ("bind" if str(volume.get("source", "")).startswith(("/", ".", "~", "$")) else "volume"))
                  if kind == "tmpfs":
                      return []
                  source = str(volume.get("source") or "")
                  return [(source, str(volume.get("target") or ""), kind == "bind")]
              text = str(volume)
              parts = text.split(":")
              if len(parts) == 1:
                  return []  # an anonymous volume: just a container path
              source, target = parts[0], parts[1]
              is_bind = source.startswith(("/", ".", "~", "$"))
              return [(source, target, is_bind)]


          def _host_path_problem(source: str, target: str) -> str:
              """Why this bind source is refused ("" when it is fine)."""
              names = (source + " " + target).lower()
              if any(sock in names for sock in SOCKET_NAMES) or source.rstrip("/").endswith("/run") or source.rstrip("/") == "/var/run":
                  return "mounts the container runtime socket, which is root on the host. Remove the mount"
              if source.startswith("$"):
                  return "has a bind source that is only known at deploy time, so it cannot be checked. Use a named volume"
              if source.startswith("~"):
                  return "bind-mounts a path in the host's home directory. Use a named volume"
              if source.startswith("/"):
                  if posixpath.normpath(source) in ALLOWED_HOST_PATHS:
                      return ""
                  return f"bind-mounts the host path '{source}'. Use a named volume (only {', '.join(ALLOWED_HOST_PATHS)} may come from the host)"
              # Relative to the compose directory: Dokploy keeps persistent files in ../files.
              clean = posixpath.normpath(source)
              if (clean == ".." or clean.startswith("../")) and not (clean == "../files" or clean.startswith("../files/")):
                  return "bind-mounts a path outside the compose directory. Use a named volume or ../files"
              return ""


          def lint_service(name: str, spec: dict) -> "list[str]":
              problems: "list[str]" = []
              if _truthy(spec.get("privileged")):
                  problems.append(f"service '{name}': privileged is set; a privileged container is root on the host. Remove 'privileged:'")
              for key in ("network_mode", *HOST_NAMESPACE_KEYS):
                  if str(spec.get(key) or "").strip().lower() == "host":
                      fix = "Remove it; services reach each other and Traefik on dokploy-network" if key == "network_mode" else "Remove it"
                      problems.append(f"service '{name}': {key}: host shares the host's namespace with the container. {fix}")
              for cap in spec.get("cap_add") or []:
                  if str(cap).upper().removeprefix("CAP_") not in ALLOWED_CAPS:
                      problems.append(f"service '{name}': cap_add '{cap}' is not allowed (allowed: {', '.join(ALLOWED_CAPS)}). Remove it")
              if spec.get("devices"):
                  problems.append(f"service '{name}': devices: gives the container host devices. Remove 'devices:'")
              if spec.get("device_cgroup_rules"):
                  problems.append(f"service '{name}': device_cgroup_rules: gives the container host devices. Remove it")
              for option in spec.get("security_opt") or []:
                  flat = str(option).lower().replace("=", ":").replace(" ", "")
                  if "unconfined" in flat or flat in ("label:disable", "no-new-privileges:false"):
                      problems.append(f"service '{name}': security_opt '{option}' turns off confinement. Remove it")
              for volume in spec.get("volumes") or []:
                  for source, target, is_bind in _sources(volume):
                      if not is_bind and not any(sock in (source + target).lower() for sock in SOCKET_NAMES):
                          continue
                      why = _host_path_problem(source, target)
                      if why:
                          problems.append(f"service '{name}': volume '{source}:{target}' {why}")
              return problems


          def lint(compose) -> "list[str]":
              """Every host-escape problem in a parsed compose document (``[]`` when it is fine)."""
              if not isinstance(compose, dict):
                  return []
              problems: "list[str]" = []
              for name, spec in (compose.get("services") or {}).items():
                  if isinstance(spec, dict):
                      problems.extend(lint_service(str(name), spec))
              # A named volume can still be a bind mount of any host path through driver options.
              for name, spec in (compose.get("volumes") or {}).items():
                  opts = (spec or {}).get("driver_opts") if isinstance(spec, dict) else None
                  if isinstance(opts, dict):
                      device = str(opts.get("device") or "")
                      if "bind" in str(opts.get("o") or "") or str(opts.get("type") or "") == "none":
                          if device and posixpath.normpath(device) not in ALLOWED_HOST_PATHS:
                              problems.append(f"volume '{name}': driver_opts bind-mount the host path '{device}'. Use a plain named volume")
              return problems


          def main(argv: "list[str]") -> int:
              """Print the problems of a compose file and exit 1 if there are any.

              With no argument it lints the rendered deploy compose (``.build/deploy-compose.yml``)
              when the release job made one, else the compose file named in ``sealedstack.yaml``.
              """
              import os

              import yaml

              if argv:
                  path = argv[0]
              elif os.path.exists(".build/deploy-compose.yml"):
                  path = ".build/deploy-compose.yml"
              else:
                  with open("sealedstack.yaml", encoding="utf-8") as handle:
                      path = (yaml.safe_load(handle) or {}).get("compose", "docker-compose.yml")
              with open(path, encoding="utf-8") as handle:
                  problems = lint(yaml.safe_load(handle) or {})
              for problem in problems:
                  print(f"::error::compose lint: {problem}" if os.environ.get("GITHUB_ACTIONS") else f"compose lint: {problem}", file=sys.stderr)
              if problems:
                  print(f"compose lint: {len(problems)} problem(s) in {path}; host-escape settings are refused (D-063)", file=sys.stderr)
                  return 1
              print(f"compose lint: {path} has no host-escape settings")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv[1:]))
          PY

      - name: Start the production deployment record
        # D-060: the released version is recorded as a GitHub Deployment of
        # environment `production` in THIS repository, with the built-in
        # GITHUB_TOKEN (needs `deployments: write` from the caller). The infra repo
        # reads the latest successful one to redeploy after a server rebuild.
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.setup.outputs.version }}
          COMPOSE_IDS: ${{ vars.SEALEDSTACK_COMPOSE_IDS }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/deployment.json"
          import json
          import os

          ids = json.loads(os.environ.get("COMPOSE_IDS") or "{}")
          version = os.environ["VERSION"]
          print(json.dumps({
              "ref": version,
              "environment": "production",
              "description": "sealedstack release " + version,
              "auto_merge": False,
              "required_contexts": [],
              "production_environment": True,
              "payload": {"version": version, "servers": sorted(ids)},
          }))
          PY
          id="$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/deployments" --input "${RUNNER_TEMP}/deployment.json" --jq .id)"
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" \
            -f state=in_progress -f environment=production \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo "recording deployment ${id} for ${VERSION}"

      - name: Update release-owned fields and deploy
        env:
          DOKPLOY_URL: ${{ vars.SEALEDSTACK_DOKPLOY_URL }}
          DOKPLOY_KEY: ${{ secrets.SEALEDSTACK_DOKPLOY_API_KEY }}
          COMPOSE_IDS: ${{ vars.SEALEDSTACK_COMPOSE_IDS }}
          VERSION: ${{ needs.setup.outputs.version }}
          MODE: ${{ needs.setup.outputs.mode }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = os.environ["DOKPLOY_URL"].rstrip("/")
          key = os.environ["DOKPLOY_KEY"]
          version = os.environ["VERSION"]
          mode = os.environ.get("MODE", "ci")
          ids = json.loads(os.environ["COMPOSE_IDS"] or "{}")
          compose_file = ""
          if mode != "server":
              with open(".build/deploy-compose.yml", encoding="utf-8") as handle:
                  compose_file = handle.read()

          def api(path, method="GET", body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(
                  url + path, data=data, method=method,
                  headers={"x-api-key": key, "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read()
              return json.loads(raw) if raw else None

          def deploy_ids(compose_id):
              rows = api(f"/api/deployment.allByCompose?composeId={compose_id}") or []
              return {str(row.get("deploymentId")) for row in rows}

          for server, compose_id in ids.items():
              current = api(f"/api/compose.one?composeId={compose_id}") or {}
              lines = [ln for ln in (current.get("env") or "").split("\n") if ln and not ln.startswith("#")]
              found = False
              out = []
              for line in lines:
                  if line.startswith("APP_VERSION="):
                      out.append(f"APP_VERSION={version}")
                      found = True
                  else:
                      out.append(line)
              if not found:
                  out.append(f"APP_VERSION={version}")
              body = {"composeId": compose_id, "env": "\n".join(out)}
              if mode == "server":
                  # server mode: Dokploy builds from the git ref; release only
                  # moves the branch to the version tag (spec 4.4).
                  body["branch"] = version
              else:
                  body["composeFile"] = compose_file
              api("/api/compose.update", "POST", body)
              before = deploy_ids(compose_id)
              api("/api/compose.deploy", "POST", {"composeId": compose_id})
              deadline = time.time() + 600
              new_id, status = None, None
              while time.time() < deadline:
                  rows = api(f"/api/deployment.allByCompose?composeId={compose_id}") or []
                  new = [r for r in rows if str(r.get("deploymentId")) not in before]
                  if new:
                      row = sorted(new, key=lambda r: r.get("createdAt") or "")[-1]
                      new_id, status = row.get("deploymentId"), row.get("status")
                      if status == "done":
                          break
                      if status in ("error", "unknown", "timeout"):
                          raise SystemExit(f"{server}: deployment {new_id} {status}")
                  time.sleep(5)
              if status != "done":
                  raise SystemExit(f"{server}: deployment {new_id or 'unknown'} did not reach done (status={status})")
              print(f"{server}: deployment {new_id} done")
          PY

      - name: Mark the deployment successful
        if: ${{ success() && steps.deployment.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=success -f environment=production \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo "recorded ${VERSION} as the released version (deployment ${DEPLOYMENT_ID})"

      - name: Mark the deployment failed
        if: ${{ (failure() || cancelled()) && steps.deployment.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=failure -f environment=production \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
