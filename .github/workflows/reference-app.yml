name: reference-app

# M3: the reference app (examples/app-template) is built, run and validated in CI
# with no live accounts. Nothing is pushed anywhere (D-053): the image is built
# and loaded into the runner only.
on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "engine/**"
      - "scripts/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/reference-app.yml"
  pull_request:
    paths:
      - "examples/**"
      - "engine/**"
      - "scripts/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/reference-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the reference app image (no push)
        uses: docker/build-push-action@v6
        with:
          context: examples/app-template
          push: false
          load: true
          tags: example-web:ci

      - name: Run the image and check /api/health
        run: |
          set -euo pipefail
          docker run -d --name ref -p 3000:3000 example-web:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"status": "ok"'
          docker rm -f ref

      - name: docker compose up --build (the developer flow)
        working-directory: examples/app-template
        run: |
          set -euo pipefail
          docker compose up -d --build --wait
          curl -fsS http://127.0.0.1:3000/api/health
          echo
          docker compose down

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyyaml==6.0.2" "jsonschema==4.23.0" pytest

      - name: Validate the sample infra config that places the app
        env:
          SEALEDSTACK_CONFIG: examples/reference-infra/config
          SEALEDSTACK_LOCAL_APPS: example-owner/example=examples/app-template
          TF_VAR_state_passphrase: ci-dummy-passphrase
        run: |
          python scripts/registry.py check
          python scripts/validate.py

      - name: Onboarding generator, add-app pull requests and reference-app tests
        env:
          PYTHONPATH: engine
        run: |
          python -m pytest -q \
            tests/pytest/test_engine_onboard.py \
            tests/pytest/test_engine_appadd_prs.py \
            tests/pytest/test_reference_app.py
