---
# ingress_pangolin role (spec section 4): idempotently deploy Pangolin.
# Selected via the ingress slot; the playbook gates this role with
# `when: slots.ingress == 'pangolin'`.

- name: Ensure the ingress_pangolin directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ ingress_pangolin_compose_dir }}"
    - "{{ ingress_pangolin_compose_dir }}/config"
    - "{{ ingress_pangolin_compose_dir }}/config/traefik"
    - "{{ ingress_pangolin_compose_dir }}/config/letsencrypt"

- name: Check for the dokploy-network
  ansible.builtin.command: docker network inspect {{ ingress_pangolin_network }}
  register: ingress_pangolin_net
  changed_when: false
  failed_when: false

- name: Create the dokploy-network
  ansible.builtin.command: docker network create {{ ingress_pangolin_network }}
  when: ingress_pangolin_net.rc != 0
  changed_when: true

- name: Render the Pangolin configuration
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ ingress_pangolin_compose_dir }}/config/config.yml"
    mode: "0640"
  notify: Restart ingress_pangolin

- name: Render the Traefik static configuration
  ansible.builtin.template:
    src: traefik_config.yml.j2
    dest: "{{ ingress_pangolin_compose_dir }}/config/traefik/traefik_config.yml"
    mode: "0640"
  notify: Restart ingress_pangolin

- name: Render the Traefik dynamic configuration
  ansible.builtin.template:
    src: dynamic_config.yml.j2
    dest: "{{ ingress_pangolin_compose_dir }}/config/traefik/dynamic_config.yml"
    mode: "0640"
  notify: Restart ingress_pangolin

- name: Render the ingress_pangolin compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ingress_pangolin_compose_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart ingress_pangolin

- name: Ensure ingress_pangolin is running
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ ingress_pangolin_compose_dir }}"
  register: ingress_pangolin_up
  changed_when: >-
    (ingress_pangolin_up.stdout ~ ingress_pangolin_up.stderr)
    is search('Created|Started|Recreated|Recreate|Pulling|Built')
