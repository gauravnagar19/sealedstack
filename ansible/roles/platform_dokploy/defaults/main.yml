---
# platform_dokploy role (spec section 7.2, D-009/D-010).
# Control servers run the Dokploy panel; workers run Docker only (Dokploy
# provisions workers itself, spec section 9.2).
# Keep this pin compatible with the `vanillauys/dokploy` provider (1.9.0);
# bump both together and re-check against the provider's schema (H9).
dokploy_version: "v0.30.8"

# DR-8: the installer is fetched from an immutable git commit and verified against a
# recorded SHA-256 before it runs; it is never piped from dokploy.com into a shell.
# The installer script is not part of the Dokploy repository's release tags: it lives
# in the Dokploy/website repository (apps/website/public/install.sh). The commit below
# is the last one that changed it before v0.30.8 was released (2026-09-29); the script
# installs the panel version given by DOKPLOY_VERSION (set from dokploy_version).
#
# Bumping (a maintainer, in one reviewed PR, with dokploy_version):
#   1. pick the website commit that was current when the new Dokploy tag shipped:
#        git log -1 --format=%H --before=<release date> -- apps/website/public/install.sh
#   2. download that exact file and record its digest:
#        curl -fsSL https://raw.githubusercontent.com/Dokploy/website/<commit>/apps/website/public/install.sh | sha256sum
#   3. read the diff against the previous installer, then update the two values below.
# Renovate bumps dokploy_version (renovate.json); the installer pin is bumped by hand
# because it is a commit, not a release.
dokploy_installer_commit: "a9aae180c2b01d16053da25054c000252926f38f"
dokploy_installer_sha256: "92749e5fe1678d1a2dc1e5bad193a1e113fcdbee3cf24193fc14ab85765b6b8a"
dokploy_install_url: "https://raw.githubusercontent.com/Dokploy/website/{{ dokploy_installer_commit }}/apps/website/public/install.sh"
dokploy_installer_path: /root/.sealedstack-dokploy-install.sh
