---
# firewall role (spec sections 7.2 and 7.3, D-005).
# UFW denies by default, the mesh is trusted, and a DOCKER-USER block closes
# Docker's well-known bypass of UFW's INPUT rules.

- name: Detect the IPv4 default route
  ansible.builtin.command: ip route show default
  register: firewall_default_route
  changed_when: false

- name: Detect the IPv6 default route
  ansible.builtin.command: ip -6 route show default
  register: firewall_default_route6
  changed_when: false
  failed_when: false

- name: Work out the WAN interfaces
  ansible.builtin.include_tasks: interfaces.yml

- name: Read the current UFW status
  ansible.builtin.command: ufw status verbose
  register: firewall_status
  changed_when: false

- name: Set the UFW default policies
  ansible.builtin.command: "ufw default {{ item.policy }} {{ item.direction }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
    - { direction: routed, policy: deny }
  changed_when: "item.policy ~ ' (' ~ item.direction ~ ')' not in firewall_status.stdout"

- name: Trust the mesh interface
  ansible.builtin.command: ufw allow in on {{ mesh_interface }}
  when: mesh_interface | default('') | length > 0
  register: firewall_mesh_allow
  changed_when: "'Skipping' not in firewall_mesh_allow.stdout"

- name: Allow the mesh direct path
  ansible.builtin.command: ufw allow {{ mesh_direct_port }}/udp
  when: mesh_direct_port | default('') | length > 0 and mesh_direct_port != '0'
  register: firewall_direct_allow
  changed_when: "'Skipping' not in firewall_direct_allow.stdout"

- name: Close the Docker/UFW bypass (IPv4)
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} sealedstack DOCKER-USER"
    block: "{{ lookup('ansible.builtin.template', 'docker-user-block.j2') }}"
  vars:
    interfaces: ["{{ firewall_wan_if }}"]
  notify: Reload ufw

- name: Check whether ip6tables is available
  ansible.builtin.command: ip6tables -L -n
  register: firewall_ip6tables
  changed_when: false
  failed_when: false

- name: Close the Docker/UFW bypass (IPv6)
  ansible.builtin.blockinfile:
    path: /etc/ufw/after6.rules
    marker: "# {mark} sealedstack DOCKER-USER"
    block: "{{ lookup('ansible.builtin.template', 'docker-user-block.j2') }}"
  vars:
    interfaces: "{{ firewall_wan6_interfaces }}"
  # Enforce the block whenever ip6tables exists (Docker's ip6tables option is
  # enabled by the docker role); do not wait for Docker to have created the
  # chain, or a boot-time reload leaves IPv6 wide open.
  when: firewall_ip6tables.rc == 0
  notify: Reload ufw

- name: Enable UFW
  ansible.builtin.command: ufw --force enable
  when: "'Status: active' not in firewall_status.stdout"
  changed_when: true
