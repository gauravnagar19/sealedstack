---
# ingress_traefik role (spec section 4): idempotently deploy Traefik at the edge.
# Selected via the ingress slot; the playbook gates this role with
# `when: ingress == 'traefik'`.

- name: Ensure the ingress_traefik directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ ingress_traefik_compose_dir }}"
    - "{{ ingress_traefik_compose_dir }}/dynamic"

- name: Check for the dokploy-network
  ansible.builtin.command: docker network inspect {{ ingress_traefik_network }}
  register: ingress_traefik_net
  changed_when: false
  failed_when: false

- name: Create the dokploy-network
  ansible.builtin.command: docker network create {{ ingress_traefik_network }}
  when: ingress_traefik_net.rc != 0
  changed_when: true

- name: Render the Traefik static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ ingress_traefik_compose_dir }}/traefik.yml"
    mode: "0640"
  notify: Restart ingress_traefik

- name: Render the Traefik dynamic configuration
  ansible.builtin.template:
    src: routers.yml.j2
    dest: "{{ ingress_traefik_compose_dir }}/dynamic/routers.yml"
    mode: "0640"
  notify: Restart ingress_traefik

- name: Render the ingress_traefik compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ingress_traefik_compose_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart ingress_traefik

- name: Ensure ingress_traefik is running
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ ingress_traefik_compose_dir }}"
  register: ingress_traefik_up
  changed_when: >-
    (ingress_traefik_up.stdout ~ ingress_traefik_up.stderr)
    is search('Created|Started|Recreated|Recreate|Pulling|Built')
