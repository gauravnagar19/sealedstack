---
# ingress_nginx role (spec section 4): idempotently deploy nginx + certbot at
# the edge. Selected via the ingress slot; the playbook gates this role with
# `when: ingress == 'nginx'`.

- name: Ensure the ingress_nginx directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ ingress_nginx_compose_dir }}"
    - "{{ ingress_nginx_compose_dir }}/conf.d"
    - "{{ ingress_nginx_compose_dir }}/certbot/conf"
    - "{{ ingress_nginx_compose_dir }}/certbot/www"

- name: Check for the dokploy-network
  ansible.builtin.command: docker network inspect {{ ingress_nginx_network }}
  register: ingress_nginx_net
  changed_when: false
  failed_when: false

- name: Create the dokploy-network
  ansible.builtin.command: docker network create {{ ingress_nginx_network }}
  when: ingress_nginx_net.rc != 0
  changed_when: true

- name: Render the nginx server block
  ansible.builtin.template:
    src: default.conf.j2
    dest: "{{ ingress_nginx_compose_dir }}/conf.d/default.conf"
    mode: "0640"
  notify: Restart ingress_nginx

- name: Render the ingress_nginx compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ingress_nginx_compose_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart ingress_nginx

- name: Ensure ingress_nginx is running
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ ingress_nginx_compose_dir }}"
  register: ingress_nginx_up
  changed_when: >-
    (ingress_nginx_up.stdout ~ ingress_nginx_up.stderr)
    is search('Created|Started|Recreated|Recreate|Pulling|Built')
