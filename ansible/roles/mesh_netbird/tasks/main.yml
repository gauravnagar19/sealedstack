---
# mesh_netbird role (spec section 4): idempotently deploy the NetBird server.
# Selected via the mesh slot; the playbook gates this role with
# `when: slots.mesh == 'netbird'`.

- name: Ensure the mesh_netbird directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ mesh_netbird_compose_dir }}"
    - "{{ mesh_netbird_compose_dir }}/secrets"

- name: Check for the dokploy-network
  ansible.builtin.command: docker network inspect {{ mesh_netbird_network }}
  register: mesh_netbird_net
  changed_when: false
  failed_when: false

- name: Create the dokploy-network
  ansible.builtin.command: docker network create {{ mesh_netbird_network }}
  when: mesh_netbird_net.rc != 0
  changed_when: true

- name: Generate the NetBird relay auth secret
  ansible.builtin.shell:
    cmd: umask 077 && openssl rand -hex 32 > "{{ mesh_netbird_auth_secret_file }}"
    creates: "{{ mesh_netbird_auth_secret_file }}"

- name: Generate the NetBird datastore encryption key
  ansible.builtin.shell:
    cmd: umask 077 && openssl rand -hex 32 > "{{ mesh_netbird_datastore_key_file }}"
    creates: "{{ mesh_netbird_datastore_key_file }}"

- name: Generate the NetBird session cookie key
  ansible.builtin.shell:
    cmd: umask 077 && openssl rand -hex 32 > "{{ mesh_netbird_session_key_file }}"
    creates: "{{ mesh_netbird_session_key_file }}"

- name: Read the generated NetBird secrets
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ mesh_netbird_auth_secret_file }}"
    - "{{ mesh_netbird_datastore_key_file }}"
    - "{{ mesh_netbird_session_key_file }}"
  register: mesh_netbird_secrets
  no_log: true

- name: Record the NetBird secrets
  ansible.builtin.set_fact:
    mesh_netbird_auth_secret: "{{ mesh_netbird_secrets.results[0].content | b64decode | trim }}"
    mesh_netbird_datastore_key: "{{ mesh_netbird_secrets.results[1].content | b64decode | trim }}"
    mesh_netbird_session_key: "{{ mesh_netbird_secrets.results[2].content | b64decode | trim }}"
  no_log: true

- name: Render the NetBird server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ mesh_netbird_compose_dir }}/config.yaml"
    mode: "0640"
  notify: Restart mesh_netbird

- name: Render the NetBird dashboard environment
  ansible.builtin.template:
    src: dashboard.env.j2
    dest: "{{ mesh_netbird_compose_dir }}/dashboard.env"
    mode: "0640"
  notify: Restart mesh_netbird

- name: Render the NetBird compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mesh_netbird_compose_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart mesh_netbird

- name: Ensure mesh_netbird is running
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ mesh_netbird_compose_dir }}"
  register: mesh_netbird_up
  changed_when: >-
    (mesh_netbird_up.stdout ~ mesh_netbird_up.stderr)
    is search('Created|Started|Recreated|Recreate|Pulling|Built')

- name: Wait for the NetBird server to answer
  ansible.builtin.uri:
    url: "http://{{ mesh_netbird_bind_address }}:{{ mesh_netbird_management_port }}/oauth2/.well-known/openid-configuration"
    status_code: [200]
  register: mesh_netbird_health
  until: mesh_netbird_health is succeeded
  retries: 60
  delay: 5
