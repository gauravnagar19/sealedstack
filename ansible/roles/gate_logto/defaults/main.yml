---
# gate_logto role (spec section 4): self-hosted Logto identity provider on
# PostgreSQL. Joined to the dokploy-network. Selected via the gate slot; the
# playbook gates this role with `when: slots.gate == 'logto'`.
gate_logto_compose_dir: /opt/sealedstack/gate_logto
gate_logto_image: docker.io/svhd/logto
gate_logto_image_tag: "1.24.0"  # pinned; confirm the current tag before use
gate_logto_port: 3001           # OIDC / API
gate_logto_admin_port: 3002     # admin console
# Publish the host ports on the mesh/localhost, never the WAN (M8).
gate_logto_bind_address: "{{ mesh_bind_address | default('127.0.0.1') }}"
gate_logto_server_url: "https://auth.example.com"
gate_logto_admin_url: "https://admin.example.com"
gate_logto_db_user: postgres
gate_logto_db_name: logto
gate_logto_network: dokploy-network
gate_logto_db_password_file: "{{ gate_logto_compose_dir }}/secrets/db_password"
