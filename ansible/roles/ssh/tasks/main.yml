---
# ssh role (spec section 7.2): re-assert the sshd hardening from bootstrap.
# The drop-in is named 00- so sshd reads it before cloud images'
# 50-cloud-init.conf (sshd keeps the FIRST value of each setting).

- name: Ensure openssh-server is present
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Ensure ssh is enabled and running
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started

- name: Install the operator SSH public keys
  ansible.posix.authorized_key:
    user: "{{ admin_user | default('admin') }}"
    key: "{{ item }}"
    state: present
  loop: "{{ admin_ssh_keys | default([]) }}"

- name: Install the Dokploy SSH key
  ansible.posix.authorized_key:
    user: "{{ admin_user | default('admin') }}"
    key: "{{ dokploy_ssh_public_key }}"
    state: present
  when: dokploy_ssh_public_key | default('') | length > 0

- name: Check the admin authorized_keys file
  ansible.builtin.stat:
    path: "/home/{{ admin_user | default('admin') }}/.ssh/authorized_keys"
  register: ssh_authorized_keys

- name: Assert key-based SSH access before disabling password auth
  ansible.builtin.assert:
    that:
      - >-
        (admin_ssh_keys | default([]) | length > 0)
        or (ssh_authorized_keys.stat.exists and ssh_authorized_keys.stat.size > 0)
    fail_msg: >-
      No operator SSH key is installed and config/admin.ssh_keys is empty;
      refusing to disable password authentication (it would lock you out).

- name: Check for the cloud-init sshd drop-in
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
  register: ssh_cloud_init

- name: Neutralise the cloud-init sshd drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/50-cloud-init.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Neutralised by the sealedstack ssh role: the hardening lives in
      # 00-sealedstack.conf, which sshd reads first (alphabetical order).
  when: ssh_cloud_init.stat.exists
  notify: Restart ssh

- name: Write the sshd hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-sealedstack.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
  notify: Restart ssh

- name: Read the effective sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -T
  register: ssh_effective
  changed_when: false
  failed_when: false

- name: Assert the sshd hardening is effective
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in ssh_effective.stdout"
      - "'permitrootlogin no' in ssh_effective.stdout"
    fail_msg: >-
      sshd -T does not report the hardened settings; a cloud-init drop-in may
      be overriding 00-sealedstack.conf.
