---
# mesh_firezone role (spec section 4): idempotently deploy the Firezone Gateway.
# Selected via the mesh slot; the playbook gates this role with
# `when: slots.mesh == 'firezone'`.

- name: Ensure the mesh_firezone compose directory exists
  ansible.builtin.file:
    path: "{{ mesh_firezone_compose_dir }}"
    state: directory
    mode: "0750"

- name: Check for the dokploy-network
  ansible.builtin.command: docker network inspect {{ mesh_firezone_network }}
  register: mesh_firezone_net
  changed_when: false
  failed_when: false

- name: Create the dokploy-network
  ansible.builtin.command: docker network create {{ mesh_firezone_network }}
  when: mesh_firezone_net.rc != 0
  changed_when: true

- name: Render the Firezone Gateway compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mesh_firezone_compose_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart mesh_firezone

- name: Ensure mesh_firezone is running
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ mesh_firezone_compose_dir }}"
  register: mesh_firezone_up
  changed_when: >-
    (mesh_firezone_up.stdout ~ mesh_firezone_up.stderr)
    is search('Created|Started|Recreated|Recreate|Pulling|Built')
