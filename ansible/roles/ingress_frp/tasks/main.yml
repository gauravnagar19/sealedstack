---
# ingress_frp role (spec section 4): idempotently deploy the frp server.
# Selected via the ingress slot; the playbook gates this role with
# `when: slots.ingress == 'frp'`.

- name: Ensure the ingress_frp compose directory exists
  ansible.builtin.file:
    path: "{{ ingress_frp_compose_dir }}"
    state: directory
    mode: "0750"

- name: Check for the dokploy-network
  ansible.builtin.command: docker network inspect {{ ingress_frp_network }}
  register: ingress_frp_net
  changed_when: false
  failed_when: false

- name: Create the dokploy-network
  ansible.builtin.command: docker network create {{ ingress_frp_network }}
  when: ingress_frp_net.rc != 0
  changed_when: true

- name: Render the frps configuration
  ansible.builtin.template:
    src: frps.toml.j2
    dest: "{{ ingress_frp_compose_dir }}/frps.toml"
    mode: "0640"
  notify: Restart ingress_frp

- name: Render the ingress_frp compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ingress_frp_compose_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart ingress_frp

- name: Ensure ingress_frp is running
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ ingress_frp_compose_dir }}"
  register: ingress_frp_up
  changed_when: >-
    (ingress_frp_up.stdout ~ ingress_frp_up.stderr)
    is search('Created|Started|Recreated|Recreate|Pulling|Built')
