# App release CI: a thin caller of sealedstack's reusable workflow.
# Keep the version pinned to the sealedstack release your infra repo runs
# (sealedstack.version there); the infra repo's upgrade PR tells you when to bump it.
name: release

on:
  push:
    branches: [main] # build: mint the next version, build and push images
  workflow_dispatch: # release: deploy an existing version
    inputs:
      tag:
        description: "version to release, e.g. v0.0.12"
        required: true

jobs:
  sealedstack:
    uses: example-owner/sealedstack/.github/workflows/app.yml@v0.5.0
    with:
      event: ${{ github.event_name }}
      tag: ${{ inputs.tag }}
    secrets: inherit
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: write
      deployments: write # record the released version as a deployment (D-060)
