# Example app, a plain repo before onboarding.
services:
  ui:
    build: ./ui
    image: ghcr.io/example-owner/example-app-ui:${APP_VERSION}
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/api/health"]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ghcr.io/example-owner/example-app-api:${APP_VERSION}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: info
      EXAMPLE_API_KEY: ${EXAMPLE_API_KEY}
