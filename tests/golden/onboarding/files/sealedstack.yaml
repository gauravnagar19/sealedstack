name: example-app
compose: docker-compose.yml
web: { service: ui, port: 80, health: /api/health }
build:
  mode: ci                    # build in CI, deploy the prebuilt image (D-030)
  platforms: [linux/amd64]
needs:
  postgres:
    version: "16"
    database: example
    env: DATABASE_URL
    backup: { every: 6h, keep: 28 }
secrets: [EXAMPLE_API_KEY]
