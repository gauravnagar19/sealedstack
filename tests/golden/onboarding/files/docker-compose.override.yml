# Local development only. `docker compose up --build` loads this file
# automatically; sealedstack ignores it and deploys docker-compose.yml.
# It restores what sealedstack removes from the deployed compose file:
# published ports and the in-compose database, and it defaults APP_VERSION so
# the pinned image tag is valid without CI.
services:
  ui:
    image: ghcr.io/example-owner/example-app-ui:${APP_VERSION:-dev}
    ports:
      - "8080:80"
  api:
    image: ghcr.io/example-owner/example-app-api:${APP_VERSION:-dev}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgres://app:app@postgres:5432/example"
    depends_on:
      postgres:
        condition: service_healthy
  # the database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: example
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
